<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0c1117">
    <title>Капани — Цифровая Экосистема Города</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <!-- CSS Stylesheets -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/portal.css">
    <link rel="stylesheet" href="css/bank.css">
    <link rel="stylesheet" href="css/messenger.css">
    <link rel="stylesheet" href="css/businesses.css">
    <link rel="stylesheet" href="css/avito.css">
    <link rel="stylesheet" href="css/market.css">
    <link rel="stylesheet" href="css/jobs.css">
    <link rel="stylesheet" href="css/taxi.css">
    <link rel="stylesheet" href="css/ksb.css">
    <link rel="stylesheet" href="css/news.css">
    <link rel="stylesheet" href="css/realestate.css">
    <link rel="stylesheet" href="css/mayor.css">
</head>
<body>

    <div class="container">

        <!-- Global Top Header -->
        <header class="g-header" id="gHeader" style="display:none;"></header>

        <!-- Auth Section -->
        <section id="authSection" style="padding-top:40px;">
            <div style="text-align:center;margin-bottom:24px;">
                <div style="font-size:50px;">🏛</div>
                <h1 style="font-family:'Unbounded',sans-serif;font-size:24px;font-weight:900;margin-top:8px;">Экосистема Капаней</h1>
                <p style="font-size:13px;color:var(--muted);margin-top:4px;">Единый аккаунт во все сервисы города</p>
            </div>

            <div style="background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:24px;box-shadow:var(--shadow);">
                <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px;">Отображаемое имя / Никнейм</label>
                <input type="text" id="loginNameInput" placeholder="Введите ваше имя">

                <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px;">Пароль</label>
                <input type="password" id="loginPasswordInput" placeholder="Введите пароль">

                <button class="btn btn-primary" id="loginSubmitBtn" style="width:100%;margin-top:10px;">🚀 Войти в Капани</button>
            </div>
        </section>

        <!-- Main App Area -->
        <main id="mainApp" style="display:none;">
            <div id="service_portal" style="display:none;"></div>
            <div id="service_messenger" style="display:none;"></div>
            <div id="service_bank" style="display:none;"></div>
            <div id="service_businesses" style="display:none;"></div>
            <div id="service_market" style="display:none;"></div>
            <div id="service_avito" style="display:none;"></div>
            <div id="service_taxi" style="display:none;"></div>
            <div id="service_ksb" style="display:none;"></div>
            <div id="service_jobs" style="display:none;"></div>
            <div id="service_news" style="display:none;"></div>
            <div id="service_realestate" style="display:none;"></div>
            <div id="service_mayor" style="display:none;"></div>
        </main>

        <!-- Bottom Launcher Navigation -->
        <nav class="bottom-nav" id="bottomNav" style="display:none;"></nav>

    </div>

    <!-- Firebase Connection Engine -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, set, get, update, push, remove, onValue, off } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
        import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

        const app = initializeApp(window.KP_CONFIG.firebase);
        const db = getDatabase(app);
        const storage = getStorage(app);

        window.KP_DB = {
            db, storage,
            dbGet: async (path) => {
                const snap = await get(ref(db, path));
                return snap.exists() ? snap.val() : null;
            },
            dbSet: async (path, val) => set(ref(db, path), val),
            dbUpdate: async (path, val) => update(ref(db, path), val),
            dbPush: async (path, val) => push(ref(db, path), val),
            dbRemove: async (path) => remove(ref(db, path)),
            dbOnValue: (path, cb) => {
                const r = ref(db, path);
                onValue(r, (snap) => cb(snap.exists() ? snap.val() : null));
                return () => off(r);
            },
            uploadFile: async (path, file) => {
                try {
                    const fileRef = sRef(storage, path);
                    const snapshot = await uploadBytes(fileRef, file);
                    return await getDownloadURL(snapshot.ref);
                } catch (e) {
                    return new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onloadend = () => resolve(reader.result);
                        reader.readAsDataURL(file);
                    });
                }
            }
        };

        window.dispatchEvent(new Event('kp_firebase_ready'));
    </script>

    <!-- Core App Scripts (Compatible with file:// and http://) -->
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/economy.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/launcher.js"></script>

    <script src="js/services/portal.js"></script>
    <script src="js/services/bank.js"></script>
    <script src="js/services/messenger.js"></script>
    <script src="js/services/businesses.js"></script>
    <script src="js/services/market.js"></script>
    <script src="js/services/avito.js"></script>
    <script src="js/services/jobs.js"></script>
    <script src="js/services/taxi.js"></script>
    <script src="js/services/ksb.js"></script>
    <script src="js/services/news.js"></script>
    <script src="js/services/realestate.js"></script>
    <script src="js/services/mayor.js"></script>

    <script>
        function startAppEngine() {
            window.KP.initAuth((user) => {
                if (user) {
                    window.KP.initNotifications();
                    window.KP.initLauncher();
                    window.KP.processWeeklyEconomy();

                    if (window.initPortalService) window.initPortalService();
                    if (window.initBankService) window.initBankService();
                    if (window.initMessengerService) window.initMessengerService();
                    if (window.initBusinessesService) window.initBusinessesService();
                    if (window.initMarketService) window.initMarketService();
                    if (window.initAvitoService) window.initAvitoService();
                    if (window.initJobsService) window.initJobsService();
                    if (window.initTaxiService) window.initTaxiService();
                    if (window.initKsbService) window.initKsbService();
                    if (window.initNewsService) window.initNewsService();
                    if (window.initRealEstateService) window.initRealEstateService();
                    if (window.initMayorService) window.initMayorService();
                } else {
                    document.getElementById('authSection').style.display = 'block';
                    document.getElementById('mainApp').style.display = 'none';
                    document.getElementById('gHeader').style.display = 'none';
                    document.getElementById('bottomNav').style.display = 'none';
                }
            });

            document.getElementById('loginSubmitBtn').onclick = async () => {
                const name = document.getElementById('loginNameInput').value;
                const pass = document.getElementById('loginPasswordInput').value;

                try {
                    await window.KP.loginUser(name, pass);
                } catch (e) {
                    alert("Ошибка входа: " + e.message);
                }
            };
        }

        if (window.KP_DB) {
            startAppEngine();
        } else {
            window.addEventListener('kp_firebase_ready', startAppEngine);
        }
    </script>
</body>
</html>
