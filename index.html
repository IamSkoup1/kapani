<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08130f">
  <meta name="description" content="Технические работы. Готовится что-то маштабное...">
  <title>Технические работы</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      color-scheme: dark;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    html { min-height: 100%; background: #08130f; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; }

    .scene {
      position: relative;
      isolation: isolate;
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      padding: max(32px, env(safe-area-inset-top)) max(22px, env(safe-area-inset-right))
               max(32px, env(safe-area-inset-bottom)) max(22px, env(safe-area-inset-left));
      text-align: center;
    }

    .scene::before {
      content: "";
      position: absolute;
      z-index: -2;
      inset: -14px;
      background: #10251d url("./assets/dark-forest.webp") center center / cover no-repeat;
      filter: blur(4px) brightness(.72) saturate(.82);
      transform: scale(1.025);
    }

    .scene::after {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      background:
        radial-gradient(ellipse 75% 68% at 50% 47%, rgba(8, 19, 15, .18), rgba(4, 12, 9, .65) 100%),
        linear-gradient(180deg, rgba(4, 11, 8, .25), rgba(7, 18, 14, .24) 48%, rgba(2, 9, 6, .66));
      pointer-events: none;
    }

    .message {
      width: min(100%, 1050px);
      transform: translateY(-2%);
    }

    .line {
      width: 58px;
      height: 2px;
      margin: 0 auto 34px;
      border-radius: 10px;
      background: #a1cc9b;
      box-shadow: 0 0 20px rgba(156, 216, 151, .32);
    }

    h1 {
      margin: 0;
      color: #f2f6f1;
      font-size: clamp(2.75rem, 6.8vw, 6.4rem);
      font-weight: 750;
      letter-spacing: -.057em;
      line-height: 1.06;
      text-wrap: balance;
      text-shadow: 0 4px 35px rgba(0, 0, 0, .35);
    }

    p {
      margin: 25px 0 0;
      color: rgba(231, 242, 231, .76);
      font-size: clamp(1rem, 1.7vw, 1.35rem);
      font-weight: 400;
      letter-spacing: .02em;
      line-height: 1.55;
      text-shadow: 0 2px 18px rgba(0, 0, 0, .5);
    }

    @media (max-width: 600px) {
      .scene::before { background-position: 47% center; }
      .message { transform: translateY(-3%); }
      .line { width: 42px; margin-bottom: 25px; }
      h1 { font-size: clamp(2.6rem, 11.5vw, 4.4rem); letter-spacing: -.052em; }
      p { margin-top: 18px; max-width: 18em; margin-inline: auto; }
    }

    @media (max-width: 350px) {
      h1 { font-size: 2.35rem; }
    }
  </style>
</head>
<body>
  <main class="scene">
    <div class="message">
      <div class="line" aria-hidden="true"></div>
      <h1>Технические работы</h1>
      <p>Готовится что-то маштабное...</p>
    </div>
  </main>
</body>
</html>
